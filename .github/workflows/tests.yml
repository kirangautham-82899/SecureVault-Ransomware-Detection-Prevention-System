name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: tests only need to read the code
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-timeout
      - name: Run tests
        run: python -m pytest -v --timeout=120 tests
